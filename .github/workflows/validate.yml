name: validate

on:
  push:
    branches: [main]
  pull_request:
  # refresh.yml dispatches this for commits/PRs it creates with GITHUB_TOKEN,
  # because those never trigger push/pull_request workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: pip install jsonschema

      - name: Validate schemas and cross-file rules
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Staleness report
        run: python sources/check_staleness.py
