name: validate

on:
  push:
    branches: [main]
  pull_request:
  # refresh.yml dispatches this for commits/PRs it creates with GITHUB_TOKEN,
  # because those never trigger push/pull_request workflows on their own.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: pip install jsonschema

      - name: Validate schemas and cross-file rules
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Staleness report
        run: python sources/check_staleness.py

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # actionlint also runs shellcheck on every `run:` block (shellcheck is
      # preinstalled on ubuntu runners).
      - name: Lint workflow files (actionlint)
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
          # 1.7.7 predates the copilot-requests permission (Copilot CLI on GITHUB_TOKEN).
          ./actionlint -color -ignore 'unknown permission scope "copilot-requests"'

      - name: Lint shell scripts (shellcheck)
        run: shellcheck scripts/*.sh
