name: refresh

on:
  schedule:
    # Daily at 21:37 UTC (06:37 KST). Deliberately off the top of the hour:
    # GitHub delays (and under load drops) scheduled runs queued at :00 — the
    # old "0 6 * * 1" weekly run started 8h42m late on 2026-11-09.
    - cron: "37 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Apply mode: conditional (commit to main; hold only single-source tier flips for a review PR), direct (always commit everything to main), or pr (put everything in a review PR)"
        required: false
        default: "conditional"
        type: choice
        options:
          - conditional
          - direct
          - pr
      touch:
        description: "Force-bump checkedAt and bundle date even if values are unchanged"
        required: false
        default: false
        type: boolean
  # Called by selftest.yml to run this exact workflow against a throwaway
  # selftest/* branch. The sandbox inputs are never set by schedule/dispatch.
  workflow_call:
    inputs:
      mode:
        type: string
        default: "conditional"
      touch:
        type: boolean
        default: false
      sandbox_branch:
        description: "Self-test only: selftest/* branch used instead of main"
        type: string
        default: ""
      simulate_fail_hosts:
        description: "Self-test only: comma-separated hosts whose fetches fail"
        type: string
        default: ""
      inject_tier_flip:
        description: "Self-test only: inject one single-source tier flip"
        type: boolean
        default: false
      heartbeat_after_days:
        description: "Idle days on the base branch before a heartbeat commit"
        type: string
        default: "50"
      touch_after_days:
        description: "Idle days before a --touch refresh re-verifies and bumps checkedAt"
        type: string
        default: "45"

# Never run two refreshes at once (schedule + manual dispatch would race on push).
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # generous: each fetch retries up to 3x with backoff
    permissions:
      contents: write # push refreshed data to main
      pull-requests: write # open/close the tier review PR
      issues: write # open/update/close the refresh-alert issue
      actions: write # dispatch validate.yml + keep this schedule enabled
    outputs:
      repair_targets: ${{ steps.repair_targets.outputs.targets }}
      alert_issue: ${{ steps.alert.outputs.issue_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MODE: ${{ inputs.mode || 'conditional' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      # Production: main / refresh/model-data / refresh-alert.
      # Self-test: selftest/<x> / selftest/<x>-review / refresh-alert-selftest.
      BASE_BRANCH: ${{ inputs.sandbox_branch || 'main' }}
      PR_BRANCH: ${{ inputs.sandbox_branch && format('{0}-review', inputs.sandbox_branch) || 'refresh/model-data' }}
      ALERT_LABEL: ${{ inputs.sandbox_branch && 'refresh-alert-selftest' || 'refresh-alert' }}
      ALERT_TITLE: "${{ inputs.sandbox_branch && '[selftest] refresh: automated data refresh needs attention' || 'refresh: automated data refresh needs attention' }}"
      MODEL_TF_SIMULATE_FAIL_HOSTS: ${{ inputs.simulate_fail_hosts || '' }}
      HEARTBEAT_AFTER_DAYS: ${{ inputs.heartbeat_after_days || '50' }}
      TOUCH_AFTER_DAYS: ${{ inputs.touch_after_days || '45' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare self-test sandbox branch
        if: inputs.sandbox_branch
        run: |
          case "$BASE_BRANCH" in
            selftest/*) ;;
            *) echo "::error::sandbox_branch must start with selftest/ (got '$BASE_BRANCH')"; exit 1 ;;
          esac
          if ! git ls-remote --exit-code --heads origin "$BASE_BRANCH" >/dev/null; then
            git push origin "HEAD:refs/heads/$BASE_BRANCH"
          fi
          git fetch origin "$BASE_BRANCH"
          git checkout -B "$BASE_BRANCH" "origin/$BASE_BRANCH"
          echo "Self-test: working on $BASE_BRANCH ($(git rev-parse --short HEAD)); simulated outages: ${MODEL_TF_SIMULATE_FAIL_HOSTS:-none}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: pip install jsonschema

      - name: Determine whether a --touch refresh is needed (idle >= TOUCH_AFTER_DAYS)
        id: touch_check
        env:
          FORCE_TOUCH: ${{ inputs.touch }}
        run: |
          if [ "$FORCE_TOUCH" = "true" ]; then
            echo "flag=--touch" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_ts=$(git log -1 --format=%ct HEAD)
          now_ts=$(date +%s)
          age_days=$(( (now_ts - last_ts) / 86400 ))
          echo "Last commit age: ${age_days} days (touch after ${TOUCH_AFTER_DAYS})"
          if [ "$age_days" -ge "$TOUCH_AFTER_DAYS" ]; then
            echo "flag=--touch" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      # Each collector isolates per-source failures: a broken vendor page or
      # leaderboard keeps its previous data and is reported in status-*.json,
      # while every healthy source still refreshes.
      - name: Refresh vendor facts from official docs
        env:
          TOUCH_FLAG: ${{ steps.touch_check.outputs.flag }}
        run: python sources/fetch_vendor_facts.py ${TOUCH_FLAG:+"$TOUCH_FLAG"} --status-out "$RUNNER_TEMP/status-facts.json"

      - name: Refresh benchmark-sourced tier entries
        env:
          TOUCH_FLAG: ${{ steps.touch_check.outputs.flag }}
        run: python sources/fetch_artificial_analysis.py ${TOUCH_FLAG:+"$TOUCH_FLAG"} --status-out "$RUNNER_TEMP/status-tiers.json"

      - name: "Self-test: inject a single-source tier flip"
        if: inputs.inject_tier_flip && inputs.sandbox_branch
        run: python scripts/selftest_inject_tier_flip.py

      - name: Validate refreshed data
        run: python scripts/validate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build summary, staleness report, and gate decision
        id: gate
        run: |
          python sources/check_staleness.py --diff-head --tiers-status "$RUNNER_TEMP/status-tiers.json" --gate-out "$RUNNER_TEMP/gate.json" | tee "$RUNNER_TEMP/pr-body.md"
          cat "$RUNNER_TEMP/pr-body.md" >> "$GITHUB_STEP_SUMMARY"
          requires_pr=$(jq -r '.requires_pr' "$RUNNER_TEMP/gate.json")
          case "$MODE" in
            pr) target="pr" ;;
            direct) target="main" ;;
            *) if [ "$requires_pr" = "true" ]; then target="split"; else target="main"; fi ;;
          esac
          echo "Apply target: $target (mode=$MODE, requires_pr=$requires_pr, base=$BASE_BRANCH)"
          echo "target=$target" >> "$GITHUB_OUTPUT"

      # conditional mode + single-source tier flip: everything except the
      # flagged tier values still lands on main, so a pending review PR never
      # freezes the rest of the data.
      - name: Hold single-source tier flips back from main
        if: steps.gate.outputs.target == 'split'
        run: |
          python sources/hold_tier_shifts.py --gate "$RUNNER_TEMP/gate.json" --full-out "$RUNNER_TEMP/model-tiers.full.json"
          python scripts/validate.py

      - name: Commit and push to main
        id: push_main
        if: steps.gate.outputs.target == 'main' || steps.gate.outputs.target == 'split'
        run: |
          if git diff --quiet model-facts.json model-tiers.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add model-facts.json model-tiers.json
          {
            echo "chore: refresh model facts and tiers"
            echo
            # Refresh summary only (no staleness report), markdown headings flattened.
            sed -n '/^# Refresh Summary/,/^# Staleness report/p' "$RUNNER_TEMP/pr-body.md" \
              | sed -E '/^# /d; s/^## (.*)$/\1:/' | sed '/./,$!d' | head -n 120
            echo "Run: ${RUN_URL}"
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${BASE_BRANCH}"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Push attempt ${attempt} rejected; rebasing onto latest ${BASE_BRANCH}"
            sleep $(( attempt * 5 ))
            git pull --rebase origin "$BASE_BRANCH"
          done
          echo "::error::Could not push the refresh commit to ${BASE_BRANCH} after 3 attempts"
          exit 1

      - name: Close superseded tier review PR
        if: steps.gate.outputs.target == 'main'
        run: |
          state=$(gh pr view "$PR_BRANCH" --json state --jq .state 2>/dev/null || true)
          if [ "$state" = "OPEN" ]; then
            gh pr close "$PR_BRANCH" --delete-branch \
              --comment "Superseded by ${RUN_URL}: the gated tier change is no longer present (or was applied directly), so ${BASE_BRANCH} is already up to date."
          fi

      - name: Prepare review PR contents
        if: steps.gate.outputs.target == 'pr' || steps.gate.outputs.target == 'split'
        env:
          TARGET: ${{ steps.gate.outputs.target }}
        run: |
          body="$RUNNER_TEMP/pr-final.md"
          if [ "$TARGET" = "split" ]; then
            cp "$RUNNER_TEMP/model-tiers.full.json" model-tiers.json
            {
              echo "> Only the tier changes below are held for review. Every other fact, rank, and evidence update from this refresh was already committed to \`${BASE_BRANCH}\`."
              echo
              echo "## Single-source tier changes awaiting review"
              jq -r '.single_source_tier_shifts[] | "- " + .' "$RUNNER_TEMP/gate.json"
              echo
              echo "Merge to accept, or close to keep the current tiers (a later refresh reopens this PR if the shift persists)."
              echo
              echo "<details><summary>Full refresh summary</summary>"
              echo
              cat "$RUNNER_TEMP/pr-body.md"
              echo
              echo "</details>"
            } > "$body"
          else
            cp "$RUNNER_TEMP/pr-body.md" "$body"
          fi

      - name: Open pull request for tier review
        id: open_pr
        if: steps.gate.outputs.target == 'pr' || steps.gate.outputs.target == 'split'
        continue-on-error: true # reported in the alert issue below
        uses: peter-evans/create-pull-request@v8
        with:
          base: ${{ env.BASE_BRANCH }}
          branch: ${{ env.PR_BRANCH }}
          delete-branch: true
          title: "${{ inputs.sandbox_branch && '[selftest] chore: review model tier shift' || 'chore: review model tier shift' }}"
          commit-message: "chore: refresh model facts and tiers"
          body-path: ${{ runner.temp }}/pr-final.md
          add-paths: |
            model-facts.json
            model-tiers.json

      # Pushes and PRs made with GITHUB_TOKEN do not trigger push/pull_request
      # workflows, so validate.yml never ran on bot commits. workflow_dispatch is
      # the documented exception, so trigger it explicitly for a visible check.
      - name: Run validate workflow on bot-authored commits
        if: steps.push_main.outputs.pushed == 'true' || steps.open_pr.outputs.pull-request-operation == 'created' || steps.open_pr.outputs.pull-request-operation == 'updated'
        env:
          PUSHED: ${{ steps.push_main.outputs.pushed }}
          PR_OP: ${{ steps.open_pr.outputs.pull-request-operation }}
        run: |
          if [ "$PUSHED" = "true" ]; then
            gh workflow run validate.yml --ref "$BASE_BRANCH" || echo "::warning::could not dispatch validate.yml on $BASE_BRANCH"
          fi
          if [ "$PR_OP" = "created" ] || [ "$PR_OP" = "updated" ]; then
            gh workflow run validate.yml --ref "$PR_BRANCH" || echo "::warning::could not dispatch validate.yml on $PR_BRANCH"
          fi

      # Never fail silently: any failed step, degraded source, or PR problem
      # opens (or updates) one "refresh-alert" issue; a clean run closes it.
      - name: Report refresh health (alert issue)
        id: alert
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          PR_OUTCOME: ${{ steps.open_pr.outcome }}
          STATUS_DIR: ${{ runner.temp }}
        run: |
          if [ -f scripts/refresh_alert.sh ]; then
            bash scripts/refresh_alert.sh
          else
            echo "::error::checkout did not complete; GitHub's failed-run notification is the only alert"
            exit 1
          fi

      # Failures that look like a code problem (parser / moved page), as
      # opposed to outages, are handed to the auto-repair job below.
      - name: Find failures a code change could fix
        id: repair_targets
        if: always()
        run: |
          if [ -f scripts/auto_repair.py ]; then
            targets=$(python3 scripts/auto_repair.py targets --status-dir "$RUNNER_TEMP")
          else
            targets="[]"
          fi
          echo "Repairable: $targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # Public repos auto-disable scheduled workflows after 60 days without
      # repository activity. Two independent guards:
      #   1. re-enable the workflow through the API on every run;
      #   2. if the base branch has had no commit for HEARTBEAT_AFTER_DAYS
      #      (e.g. every refresh failed for weeks), push a heartbeat commit.
      #      A commit is unambiguously "repository activity".
      - name: Keep scheduled workflow enabled
        if: always()
        run: |
          gh api -X PUT "repos/${GH_REPO}/actions/workflows/refresh.yml/enable" \
            || echo "::warning::keepalive API call failed"

      - name: Heartbeat commit when the base branch has been idle
        if: always()
        run: |
          git fetch -q origin "$BASE_BRANCH"
          last_ts=$(git log -1 --format=%ct "origin/${BASE_BRANCH}")
          age_days=$(( ($(date +%s) - last_ts) / 86400 ))
          echo "${BASE_BRANCH} last commit ${age_days} day(s) ago (heartbeat after ${HEARTBEAT_AFTER_DAYS})"
          if [ "$age_days" -lt "$HEARTBEAT_AFTER_DAYS" ]; then
            exit 0
          fi
          wt="$RUNNER_TEMP/heartbeat"
          git worktree add -q --detach "$wt" "origin/${BASE_BRANCH}"
          printf '%s %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$RUN_URL" > "$wt/.github/refresh-heartbeat"
          git -C "$wt" add .github/refresh-heartbeat
          git -C "$wt" -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "chore: refresh heartbeat (keep scheduled workflow active)" -m "Run: ${RUN_URL}"
          git -C "$wt" push origin "HEAD:${BASE_BRANCH}"
          git worktree remove --force "$wt"

  # Claude Code proposes a fix as a review PR (see auto-repair.yml). Never in
  # self-test sandboxes, whose failures are simulated.
  repair:
    needs: refresh
    if: always() && !inputs.sandbox_branch && needs.refresh.outputs.repair_targets != '' && needs.refresh.outputs.repair_targets != '[]'
    uses: ./.github/workflows/auto-repair.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    with:
      targets: ${{ needs.refresh.outputs.repair_targets }}
      base_branch: main
      alert_issue: ${{ needs.refresh.outputs.alert_issue }}
    secrets: inherit
