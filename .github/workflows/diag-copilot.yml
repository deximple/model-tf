name: diag-copilot

# TEMPORARY: does GITHUB_TOKEN with `copilot-requests: write` let Copilot CLI
# run in Actions without a PAT? Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-copilot.yml"]

permissions:
  contents: read
  copilot-requests: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Copilot CLI
        run: npm install -g @github/copilot && copilot --version
      - name: CLI help
        run: |
          copilot --help 2>&1 | head -n 120
          echo "---- help permissions"; copilot help permissions 2>&1 | head -n 80 || true
          echo "---- help config"; copilot help config 2>&1 | head -n 60 || true
      - name: Agentic mini-test with restricted tools
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/play" && cd "$RUNNER_TEMP/play"
          timeout 300 copilot -p 'Do three things in order and report each result: (1) create a file hello.txt in the current directory containing the word hi; (2) run the shell command: python3 -c "print(2+2)"; (3) run the shell command: ls -la. End with one line starting with RESULT:' \
            --no-ask-user --allow-tool 'write' --allow-tool 'shell(python3)' 2>&1 | tail -n 40 || echo "exit=$?"
          echo "---- files:"; ls -la; cat hello.txt 2>/dev/null || echo "(no hello.txt)"
