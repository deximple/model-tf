name: diag-models

# TEMPORARY: check what GitHub Models offers this repository with the default
# GITHUB_TOKEN (no secrets). Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-models.yml"]

permissions:
  contents: read
  models: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Catalog, limits, and one tool-calling request
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          tok = os.environ["TOKEN"]
          H = {"Authorization": f"Bearer {tok}", "Accept": "application/json",
               "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          def call(url, body=None, follow=True):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=H,
                                           method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, r.geturl(), dict(r.headers), r.read().decode(errors="replace")
              except urllib.error.HTTPError as e:
                  return e.code, url, dict(e.headers), e.read().decode(errors="replace")[:600]
              except Exception as e:
                  return "ERR", url, {}, repr(e)
          body = {"model": "openai/gpt-4.1-mini", "max_tokens": 20,
                  "messages": [{"role": "user", "content": "Reply with the single word ping."}]}
          for url, b in [
              ("https://models.github.ai/catalog/models", None),
              ("https://models.github.ai/inference/chat/completions", body),
              ("https://models.inference.ai.azure.com/models", None),
              ("https://models.inference.ai.azure.com/chat/completions", dict(body, model="gpt-4o-mini")),
          ]:
              st, final, hd, txt = call(url, b)
              print(f"\n== {url}\n   status={st} final_url={final} len={len(txt)}")
              print("   headers:", json.dumps({k: v for k, v in hd.items() if k.lower() in (
                  "content-type", "server", "x-github-request-id", "x-ms-region", "via", "x-ratelimit-limit-requests",
                  "x-ratelimit-remaining-requests", "x-ratelimit-limit-tokens", "location")}))
              print("   body:", txt[:400].replace("\n", " "))
          EOF
