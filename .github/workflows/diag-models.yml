name: diag-models

# TEMPORARY: check what GitHub Models offers this repository with the default
# GITHUB_TOKEN (no secrets). Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-models.yml"]

permissions:
  contents: read
  models: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Catalog, limits, and one tool-calling request
        env:
          TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error
          tok = os.environ["TOKEN"]
          H = {"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json",
               "X-GitHub-Api-Version": "2022-11-28", "Content-Type": "application/json"}
          def call(url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=H,
                                           method="POST" if body else "GET")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, dict(r.headers), r.read().decode()
              except urllib.error.HTTPError as e:
                  return e.code, dict(e.headers), e.read().decode()[:800]
          st, hd, body = call("https://models.github.ai/catalog/models")
          print("catalog status", st)
          try:
              cat = json.loads(body)
          except ValueError:
              print(body[:800]); cat = []
          rows = []
          for m in cat:
              lim = m.get("limits") or {}
              rows.append((m.get("id"), m.get("rate_limit_tier"), lim.get("max_input_tokens"), lim.get("max_output_tokens"),
                           ",".join(m.get("capabilities") or [])))
          for r in sorted(rows, key=lambda r: str(r[0])):
              print("  ", r)
          tool = {"type": "function", "function": {"name": "echo", "description": "Echo a word",
                  "parameters": {"type": "object", "properties": {"word": {"type": "string"}}, "required": ["word"]}}}
          for model in [r[0] for r in rows if "tool-calling" in r[4]][:0] + [
              "openai/gpt-5", "openai/gpt-5-mini", "openai/gpt-4.1", "openai/gpt-4.1-mini", "openai/o4-mini"]:
              st, hd, body = call("https://models.github.ai/inference/chat/completions", {
                  "model": model, "max_tokens": 200, "tools": [tool],
                  "messages": [{"role": "user", "content": "Call the echo tool with the word ping."}]})
              lim = {k: v for k, v in hd.items() if "ratelimit" in k.lower() or "quota" in k.lower()}
              print(f"\n== {model}: HTTP {st}  {json.dumps(lim)}")
              print(body[:500])
          EOF
