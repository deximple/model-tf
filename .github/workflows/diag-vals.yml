name: diag-vals

# TEMPORARY diagnostic for the Vals AI parser ("parsed 0 rows" on 2026-11-16).
# Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-vals.yml", "sources/fetch_artificial_analysis.py"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect vals.ai/benchmarks as the collector sees it
        run: |
          python3 - <<'EOF'
          import html, re, sys, urllib.request
          sys.path.insert(0, "sources")
          import fetch_artificial_analysis as aa
          req = urllib.request.Request(aa.VALS_URL, headers={"User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) model-tf-refresh/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("status", r.status, "final_url", r.geturl(), "content-type", r.headers.get("content-type"))
              page = r.read().decode("utf-8", "replace")
          print("length", len(page))
          t = re.search(r"<title>(.*?)</title>", page, re.S)
          print("title", t.group(1).strip() if t else None)
          for pat in ['props="', "astro-island", "companies", "points", "Vals Index", "vals_index", "valsIndex",
                      "__NEXT_DATA__", "self.__next_f", "cf-chl", "Just a moment", "challenge", "score", "label"]:
              print(f"count {pat!r}: {page.count(pat)}")
          print("parser rows:", len(aa.parse_vals_benchmarks(page)))
          for pat in ["Vals Index", "astro-island", "companies", "__next_f"]:
              i = page.find(pat)
              if i >= 0:
                  print(f"--- context {pat!r} @ {i}:\n{page[max(0, i-300):i+700]}\n")
          islands = re.findall(r"<astro-island[^>]*>", page)
          print("astro islands:", len(islands))
          for tag in islands[:8]:
              comp = re.search(r'component-url="([^"]*)"', tag)
              props = re.search(r'props="([^"]*)"', tag)
              print(" island", comp.group(1) if comp else None, "props-len", len(props.group(1)) if props else None,
                    "has points", bool(props and "points" in props.group(1)),
                    "props-head", html.unescape(props.group(1))[:300] if props else None)
          links = sorted(set(re.findall(r'href="(/benchmarks[^"#?]*)"', page)))
          print("benchmark links:", links[:40])
          EOF
