name: diag-vals

# TEMPORARY diagnostic for the Vals AI parser ("parsed 0 rows" on 2026-11-16).
# Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-vals.yml", "sources/fetch_artificial_analysis.py"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect vals.ai/benchmarks/vals_index
        run: |
          python3 - <<'EOF'
          import html, json, re, sys, urllib.request
          sys.path.insert(0, "sources")
          import fetch_artificial_analysis as aa
          url = "https://www.vals.ai/benchmarks/vals_index"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7) model-tf-refresh/1.0"})
          with urllib.request.urlopen(req, timeout=60) as r:
              print("status", r.status, "final_url", r.geturl())
              page = r.read().decode("utf-8", "replace")
          print("length", len(page))
          for pat in ['props="', "companies", "points", "label", "score", "accuracy", "Opus", "GPT", "Gemini"]:
              print(f"count {pat!r}: {page.count(pat)}")
          print("current parser rows on this page:", len(aa.parse_vals_benchmarks(page)))
          islands = re.findall(r"<astro-island[^>]*>", page)
          print("astro islands:", len(islands))
          for tag in islands:
              comp = re.search(r'component-url="([^"]*)"', tag)
              props = re.search(r'props="([^"]*)"', tag)
              raw = html.unescape(props.group(1)) if props else ""
              keys = []
              try:
                  keys = list(json.loads(raw).keys()) if raw else []
              except Exception as exc:
                  keys = [f"<json error {exc}>"]
              print("\n== island", comp.group(1) if comp else None, "props-len", len(raw), "keys", keys)
              if any(k in raw for k in ("score", "accuracy", "Opus", "points")):
                  print(raw[:2500])
          for pat in ["Opus", "accuracy"]:
              i = page.find(pat)
              if i >= 0:
                  print(f"\n--- context {pat!r} @ {i}:\n{page[max(0, i-800):i+800]}")
          EOF
