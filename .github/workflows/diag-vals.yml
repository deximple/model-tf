name: diag-vals

# TEMPORARY diagnostic for the Vals AI parser ("parsed 0 rows" on 2026-11-16).
# Removed before merge.
on:
  push:
    branches: [claude/beautiful-bell-fewls0]
    paths: [".github/workflows/diag-vals.yml", "sources/fetch_artificial_analysis.py"]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Run the fixed Vals parser live through the collector's fetch
        run: |
          python3 - <<'EOF'
          import json, sys
          sys.path.insert(0, "sources")
          import fetch_artificial_analysis as aa
          rows, err = aa._safe_fetch_list("Vals AI", aa.parse_vals_benchmarks, aa.VALS_URL)
          print("url", aa.VALS_URL, "error", err, "rows", len(rows))
          for r in rows[:12]:
              print("  ", r)
          facts = json.load(open("model-facts.json"))
          idx = aa.build_auto_name_index(facts["models"])
          matched = [r for r in rows if aa.resolve_model(aa.parse_name(r["model_label"])[0], idx)]
          print("matched to model-facts.json:", len(matched), "of", len(rows))
          tiers = json.load(open("model-tiers.json"))
          had = sum(1 for e in tiers["entries"] if any("vals.ai" in v["source"] for v in e["evidence"]))
          print("entries with Vals evidence on this commit:", had)
          sys.exit(0 if rows and matched else 1)
          EOF
